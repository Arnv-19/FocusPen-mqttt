# FocusPen — topic permissions per user
#
# This is what makes "dev mode" a real security boundary instead of a
# checkbox in the browser. Anyone with devtools open can try to publish
# to focuspen/+/haptic — this file decides whether the broker lets them.

# --- pens themselves: can publish their own data/status, and read
#     commands addressed to them. Cannot touch any other pen's topics
#     or any other pen's control topics. ---
user pen01
topic write focuspen/pen01/data
topic write focuspen/pen01/status
topic write focuspen/pen01/inference
topic read  focuspen/pen01/haptic
topic read  focuspen/pen01/config

# Add one block per additional pen, e.g.:
# user pen02
# topic write focuspen/pen02/data
# topic write focuspen/pen02/status
# topic write focuspen/pen02/inference
# topic read  focuspen/pen02/haptic
# topic read  focuspen/pen02/config

# --- backend service: the only client allowed to read all pens' data
#     and write commands to all pens. The dashboard never connects to
#     MQTT directly — it goes through this backend, which is also where
#     dev-mode is actually enforced (see backend/app/mqtt_client.py). ---
user backend
topic read  focuspen/+/data
topic read  focuspen/+/status
topic read  focuspen/+/inference
topic write focuspen/+/haptic
topic write focuspen/+/config

# --- controller: optional direct-MQTT debugging account (e.g. for
#     MQTT Explorer during bring-up). Not used by the dashboard. ---
user controller
topic readwrite focuspen/#
