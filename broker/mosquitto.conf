# FocusPen — Mosquitto broker config
# Run with:  mosquitto -c mosquitto.conf -v
#
# Two listeners:
#   1883 — standard MQTT, used by the ESP32 firmware (PubSubClient)
#   9001 — MQTT over WebSockets, used only if a browser needs to speak
#          MQTT directly. The recommended dashboard architecture uses
#          a Python backend instead (see backend/), so 9001 is optional
#          but left enabled for flexibility / debugging with MQTT Explorer.

listener 1883
protocol mqtt

listener 9001
protocol websockets

# ---------- authentication ----------
# Anonymous access is OFF. Every client (pen, backend, dev-mode browser
# session) authenticates with a username/password from passwordfile,
# and what each is ALLOWED to do is restricted by acl.conf below.
#
# Generate passwordfile with:
#   mosquitto_passwd -c passwordfile pen01
#   mosquitto_passwd   passwordfile backend
#   mosquitto_passwd   passwordfile controller
# (drop -c after the first user, or it overwrites the file)

allow_anonymous false
password_file passwordfile
acl_file acl.conf

persistence true
persistence_location ./data/
log_dest stdout
