# FocusPen — Mosquitto broker config

listener 1883 0.0.0.0
protocol mqtt

listener 9001
protocol websockets

# ---------- authentication ----------
# Temporarily set to true so the pen can connect without a password
allow_anonymous true

# Commented out for local hotspot testing
# password_file passwordfile
# acl_file acl.conf

persistence true
persistence_location ./data/
log_dest stdout